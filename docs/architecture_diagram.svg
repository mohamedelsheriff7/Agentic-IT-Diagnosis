<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" role="img" aria-labelledby="title desc">
<title id="title">Agentic IT diagnosis architecture</title><desc id="desc">Users interact with the Orchestrate IT Support Supervisor. It screens tickets through the Escalation and Outage Agent, delegates diagnosis to an existing external Python Diagnostic Agent, and uses the Routing Agent. All agents use authenticated tools against the mock Maximo API, whose SQLite database stores tickets, evidence, worklogs, diagnostic results and global incidents.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#426276"/></marker><style>
.bg{fill:#f5f8fb}.box{fill:#fff;stroke:#176c80;stroke-width:2;rx:16}.agent{fill:#eaf4f7;stroke:#176c80;stroke-width:2;rx:16}.gate{fill:#fff4d7;stroke:#bd8420;stroke-width:2;rx:16}.store{fill:#eef0fb;stroke:#6267a9;stroke-width:2;rx:16}.line{stroke:#426276;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:9 7}.title{font:700 30px Arial;fill:#14364b}.h{font:700 21px Arial;fill:#14364b}.p{font:16px Arial;fill:#263d4b}.small{font:14px Arial;fill:#405968}.label{font:700 14px Arial;fill:#176c80}.foot{font:14px Arial;fill:#536574}
</style></defs><rect class="bg" width="1500" height="950"/>
<text x="65" y="58" class="title">Agentic IT Diagnosis and Resolution</text><text x="65" y="88" class="small">Orchestrate coordinates; the existing Python agent owns diagnostic reasoning. Workstream B policy approval is pending.</text>
<rect class="box" x="65" y="145" width="255" height="115"/><text x="90" y="183" class="h">User / Ticket</text><text x="90" y="215" class="p">Ticket ID or chat issue</text><text x="90" y="240" class="small">Answers diagnostic questions</text>
<rect class="agent" x="405" y="130" width="370" height="155"/><text x="435" y="172" class="h">IT Support Supervisor</text><text x="435" y="204" class="p">Entry point and user communication</text><text x="435" y="232" class="p">Screens every new ticket first</text><text x="435" y="260" class="small">Delegates, verifies actions, summarizes</text>
<rect class="agent" x="900" y="110" width="510" height="190"/><text x="935" y="153" class="h">Escalation &amp; Outage Agent</text><text x="935" y="187" class="p">Find matching global; otherwise count exact scope</text><text x="935" y="216" class="p">Check service evidence; link/create or request human</text><text x="935" y="245" class="small">3/30 only for the three configured category/CI/site scopes</text><text x="935" y="273" class="small">Draft policy: execution waits for owner approval</text>
<rect class="agent" x="405" y="370" width="370" height="220"/><text x="435" y="414" class="h">Diagnostic Agent</text><text x="435" y="447" class="p">Existing external Python service</text><text x="435" y="480" class="p">Candidates → question / safe check</text><text x="435" y="509" class="p">Evidence → eliminate → diagnose</text><text x="435" y="542" class="small">Maintains trace and evidence-based confidence</text><text x="435" y="570" class="small">Resolve only with approved article + all gates</text>
<rect class="agent" x="900" y="390" width="510" height="165"/><text x="935" y="434" class="h">Routing Agent</text><text x="935" y="468" class="p">Diagnosis evidence → owner, confidence, alternatives</text><text x="935" y="497" class="p">HIGH: specialist; MEDIUM: L1; LOW: human triage</text><text x="935" y="526" class="small">Safety/privilege/priority 1 always human</text>
<rect class="gate" x="900" y="635" width="510" height="115"/><text x="935" y="678" class="h">Workstream B Knowledge</text><text x="935" y="710" class="p">Diagnostic articles • routing • outage policy</text><text x="935" y="737" class="small">Current articles and narrative policy are unapproved drafts</text>
<rect class="box" x="405" y="675" width="370" height="105"/><text x="435" y="717" class="h">Authenticated Tool API</text><text x="435" y="750" class="p">OpenAPI tools • X-API-Key</text>
<rect class="store" x="65" y="675" width="255" height="145"/><text x="90" y="718" class="h">Mock Maximo API</text><text x="90" y="750" class="p">SQLite ticket database</text><text x="90" y="779" class="small">Tickets • worklogs • evidence</text><text x="90" y="802" class="small">Results • globals • notifications</text>
<path class="line" d="M320 202 H400"/><text x="330" y="187" class="label">chat / ID</text>
<path class="line" d="M775 180 H895"/><text x="790" y="164" class="label">1. screen</text>
<path class="line" d="M900 265 C835 300 815 330 773 410"/><text x="790" y="323" class="label">clear to diagnose</text>
<path class="line" d="M775 460 H895"/><text x="790" y="444" class="label">diagnosed</text>
<path class="line" d="M670 370 C730 325 820 260 900 220"/><text x="730" y="343" class="label">outage signal</text>
<path class="line" d="M590 285 V365"/><text x="605" y="328" class="label">questions / answer</text>
<path class="line" d="M590 590 V670"/><text x="605" y="637" class="label">tool calls</text>
<path class="line" d="M405 730 H325"/><text x="330" y="715" class="label">read / write</text>
<path class="line" d="M900 690 C840 660 810 600 775 560"/><text x="789" y="634" class="label">retrieval</text>
<path class="line dash" d="M1180 300 V385"/><text x="1195" y="350" class="label">route after diagnosis</text>
<path class="line dash" d="M900 690 C820 705 730 630 695 590"/><text x="742" y="672" class="label">diagnostic retrieval</text>
<path class="line dash" d="M900 730 C840 770 795 775 775 740"/><text x="793" y="795" class="label">policy / group reference</text>
<text x="65" y="885" class="foot">Audit: state-changing tools persist SQLite worklogs/evidence. Notifications are MOCK. Human review REQUESTED is not approval.</text>
</svg>
