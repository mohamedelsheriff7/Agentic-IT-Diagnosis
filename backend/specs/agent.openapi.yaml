openapi: 3.0.3
info:
  title: 'Workstream C: Synthetic IT Diagnostics Backend'
  description: Deterministic mock tools; no account changes, LLM, external notifications
    or hidden answers. Admin API is excluded from agent export.
  version: 1.0.0
paths:
  /tickets/{ticket_id}:
    get:
      tags:
      - agent-tools
      summary: Read a ticket and its recorded evidence
      description: Use before deciding next steps. Returns worklogs, related global
        issue, evidence and latest versioned diagnosis; no hidden answers.
      operationId: get_ticket_details
      security:
      - ServiceApiKey: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          description: Server-generated ticket ID, for example INC-1001
          title: Ticket Id
          example: INC-1001
        description: Server-generated ticket ID, for example INC-1001
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetails'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown ticket or reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Retry conflict, invalid status or relationship conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request or policy rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error; use request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tickets/search-similar:
    post:
      tags:
      - agent-tools
      summary: Retrieve resolved historical examples
      description: Use to compare symptoms with resolved/closed tickets. Deterministic
        lexical score is not diagnostic confidence; no useful overlap returns an empty
        list.
      operationId: search_similar_tickets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchTickets'
            example:
              description: password expired sign in
              limit: 5
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarResults'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown ticket or reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Retry conflict, invalid status or relationship conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request or policy rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error; use request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ServiceApiKey: []
  /tickets:
    post:
      tags:
      - agent-tools
      summary: Capture a chat issue
      description: Use when no ticket exists. Requires a synthetic reporter; preserves
        unknown classification. Supply a stable action_id for retries.
      operationId: create_ticket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicket'
            example:
              action_id: create-demo-001
              summary: Cannot sign in
              description: The portal rejects my sign-in.
              reported_by_id: USR-001
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetails'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown ticket or reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Retry conflict, invalid status or relationship conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request or policy rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error; use request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ServiceApiKey: []
  /tickets/{ticket_id}/assignment:
    post:
      tags:
      - agent-tools
      summary: Route with confidence and evidence
      description: Use after diagnostic investigation. HIGH routes to requested group
        subject to review. MEDIUM routes to L1 preserving alternatives. LOW requires
        human triage.
      operationId: assign_ticket
      security:
      - ServiceApiKey: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          description: Server-generated ticket ID, for example INC-1001
          title: Ticket Id
          example: INC-1001
        description: Server-generated ticket ID, for example INC-1001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTicket'
            example:
              action_id: assign-demo-001
              resolver_group_id: GRP-APP
              confidence: HIGH
              reason: Only the application fails; identity checks are healthy.
              alternative_resolver_group_ids:
              - GRP-IAM
              evidence_ids: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentOut'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown ticket or reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Retry conflict, invalid status or relationship conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request or policy rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error; use request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tickets/{ticket_id}/worklogs:
    post:
      tags:
      - agent-tools
      summary: Record a question, response or diagnostic note
      description: Use for intermediate reasoning and user responses. Cannot change
        status or owner. New evidence is limited to asserted user/knowledge/history
        sources; tool evidence comes only from checks.
      operationId: add_worklog_entry
      security:
      - ServiceApiKey: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          description: Server-generated ticket ID, for example INC-1001
          title: Ticket Id
          example: INC-1001
        description: Server-generated ticket ID, for example INC-1001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWorklog'
            example:
              action_id: note-demo-001
              entry_type: QUESTION
              summary: Do other applications work?
              rationale: Discriminate shared identity from app-specific failure.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorklogOut'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown ticket or reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Retry conflict, invalid status or relationship conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request or policy rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error; use request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tickets/{ticket_id}/resolution:
    post:
      tags:
      - agent-tools
      summary: Resolve a safely diagnosed issue
      description: Use only after approved article conditions and steps are met, with
        recorded diagnosis and explicit user success confirmation. Mandatory human
        cases are rejected. Sets RESOLVED, never CLOSED.
      operationId: resolve_ticket
      security:
      - ServiceApiKey: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          description: Server-generated ticket ID, for example INC-1001
          title: Ticket Id
          example: INC-1001
        description: Server-generated ticket ID, for example INC-1001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveTicket'
            example:
              action_id: resolve-demo-001
              diagnosis_code: PASSWORD_EXPIRED
              resolution_summary: User completed self-service change and confirmed
                successful sign-in.
              steps_completed:
              - PASSWORD_EXPIRED-1
              knowledge_article_id: KB-001
              user_confirmed_success: true
              evidence_ids:
              - EV-from-account-check
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetails'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown ticket or reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Retry conflict, invalid status or relationship conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request or policy rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error; use request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tickets/count-recent:
    post:
      tags:
      - agent-tools
      summary: Count an active issue cluster in a UTC window
      description: Use for outage investigation. Supplied filters use AND; requires
        a filter. Inclusive window excludes global, resolved, closed and already globally
        linked tickets.
      operationId: count_recent_tickets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountRecent'
            example:
              category: VPN
              configuration_item_id: CI-VPN
              location_id: LOC-A
              window_minutes: 30
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountOut'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown ticket or reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Retry conflict, invalid status or relationship conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request or policy rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error; use request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ServiceApiKey: []
  /global-tickets/search:
    post:
      tags:
      - agent-tools
      summary: Find an active global issue in a scope
      description: Use before creating a global issue. All supplied exact-match filters
        use AND; empty filters are rejected. Closed/resolved global issues are excluded.
      operationId: find_open_global_tickets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Grouping'
            example:
              category: VPN
              configuration_item_id: CI-VPN
              location_id: LOC-A
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalResults'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown ticket or reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Retry conflict, invalid status or relationship conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request or policy rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error; use request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ServiceApiKey: []
  /global-tickets:
    post:
      tags:
      - agent-tools
      summary: Create or reuse a scoped global incident
      description: Use after the agent evaluates outage thresholds. Requires category,
        CI, location and active related tickets in that scope. Atomic linking and
        unique active scope prevent duplicates.
      operationId: create_global_ticket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGlobal'
            example:
              action_id: outage-demo-001
              summary: VPN unavailable at site A
              description: Three affected synthetic users within 30 minutes.
              severity: SEV2
              category: VPN
              configuration_item_id: CI-VPN
              location_id: LOC-A
              owner_group_id: GRP-NET
              related_ticket_ids:
              - CLUSTER-1-1
              - CLUSTER-1-2
              reason: Cluster and independent health observation support outage investigation.
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalCreated'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown ticket or reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Retry conflict, invalid status or relationship conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request or policy rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error; use request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ServiceApiKey: []
  /tickets/{ticket_id}/global-link:
    post:
      tags:
      - agent-tools
      summary: Link an affected ticket to an existing outage
      description: Use when an active global issue already covers this exact category/CI/location.
        Conflicting, self and inactive links are rejected; identical links add no
        duplicate worklogs.
      operationId: link_ticket_to_global_ticket
      security:
      - ServiceApiKey: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          description: Server-generated ticket ID, for example INC-1001
          title: Ticket Id
          example: INC-1001
        description: Server-generated ticket ID, for example INC-1001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkGlobal'
            example:
              action_id: link-demo-001
              global_ticket_id: GLB-from-create
              reason: Same service, category and site.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkOut'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown ticket or reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Retry conflict, invalid status or relationship conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request or policy rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error; use request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /diagnostics/account-status:
    post:
      tags:
      - agent-tools
      summary: Observe synthetic account state
      description: Use to discriminate lockout, password expiry and MFA conditions.
        Reads stored state; unknown state remains UNKNOWN. Records evidence only,
        never modifies accounts or returns secrets.
      operationId: check_account_status
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCheck'
            example:
              action_id: account-demo-001
              ticket_id: INC-1001
              user_id: USR-001
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOut'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown ticket or reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Retry conflict, invalid status or relationship conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request or policy rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error; use request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ServiceApiKey: []
  /diagnostics/application-entitlement:
    post:
      tags:
      - agent-tools
      summary: Observe synthetic application access
      description: Use to distinguish missing entitlement or role from authentication
        failure. Reads stored provisioning state and records evidence; never grants
        access.
      operationId: check_application_entitlement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntitlementCheck'
            example:
              action_id: entitlement-demo-001
              ticket_id: INC-1004
              user_id: USR-004
              application_id: APP-PORTAL
              required_role: USER
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementOut'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown ticket or reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Retry conflict, invalid status or relationship conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request or policy rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error; use request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ServiceApiKey: []
  /diagnostics/service-health:
    post:
      tags:
      - agent-tools
      summary: Observe independent synthetic service health
      description: Use to compare local symptoms with a stored service observation
        for the exact CI/location. Never infers health from ticket counts. Records
        evidence, with UNKNOWN when absent.
      operationId: check_service_health
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthCheck'
            example:
              action_id: health-demo-001
              ticket_id: CLUSTER-1-1
              configuration_item_id: CI-VPN
              location_id: LOC-A
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown ticket or reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Retry conflict, invalid status or relationship conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request or policy rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error; use request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ServiceApiKey: []
  /tickets/{ticket_id}/human-reviews:
    post:
      tags:
      - agent-tools
      summary: Request human review or triage
      description: Use for mandatory human cases or uncertainty. Sets PENDING and
        records a REQUESTED review; this is not approval. Only authenticated admin
        can decide a review.
      operationId: request_human_review
      security:
      - ServiceApiKey: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          description: Server-generated ticket ID, for example INC-1001
          title: Ticket Id
          example: INC-1001
        description: Server-generated ticket ID, for example INC-1001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestReview'
            example:
              action_id: review-demo-001
              reason: Insufficient evidence to diagnose safely.
              review_type: INVESTIGATION
              suggested_group_id: GRP-L1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewOut'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown ticket or reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Retry conflict, invalid status or relationship conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request or policy rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error; use request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tickets/{ticket_id}/notifications:
    post:
      tags:
      - agent-tools
      summary: Store a mock resolver notification
      description: Use after routing or escalation to record intended communication.
        Stores SQLite notification and worklog; sends no external message.
      operationId: notify_resolver_group
      security:
      - ServiceApiKey: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          description: Server-generated ticket ID, for example INC-1001
          title: Ticket Id
          example: INC-1001
        description: Server-generated ticket ID, for example INC-1001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notify'
            example:
              action_id: notify-demo-001
              resolver_group_id: GRP-NET
              severity: SEV2
              message: Synthetic VPN outage investigation requested.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationOut'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown ticket or reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Retry conflict, invalid status or relationship conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request or policy rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error; use request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /knowledge/search:
    post:
      tags:
      - agent-tools
