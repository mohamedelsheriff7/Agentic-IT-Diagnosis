          description: Invalid request or policy rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error; use request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ServiceApiKey: []
  /tickets/{ticket_id}/diagnostic-results:
    post:
      tags:
      - agent-tools
      summary: Persist a structured diagnostic conclusion
      description: Use after collecting evidence. Stores agent assertions and confidence
        basis as a new version, validates sources/policy and updates valid taxonomy.
        Does not resolve or assign automatically.
      operationId: record_diagnostic_result
      security:
      - ServiceApiKey: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          description: Server-generated ticket ID, for example INC-1001
          title: Ticket Id
          example: INC-1001
        description: Server-generated ticket ID, for example INC-1001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticInput'
            example:
              action_id: diagnosis-demo-001
              diagnosis_code: PASSWORD_EXPIRED
              outcome: DIAGNOSED
              candidate_diagnoses:
              - diagnosis_code: PASSWORD_EXPIRED
                reason: Expiry observation with active unlocked account.
              eliminated_diagnoses:
              - diagnosis_code: ACCOUNT_LOCKED
                reason: Account check reports unlocked.
              evidence_ids:
              - EV-from-account-check
              knowledge_article_ids:
              - KB-001
              confidence: HIGH
              confidence_basis:
                knowledge_match_strength: HIGH
                evidence_completeness: HIGH
                historical_agreement: NOT_AVAILABLE
                alternatives_excluded: true
              recommended_action: RESOLVE
              missing_information: []
              rationale: User response and recorded account evidence agree.
