[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "workstream-c-backend"
version = "1.0.0"
description = "Deterministic synthetic IT diagnosis and resolution tools"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "sqlalchemy", "pydantic", "python-dotenv", "pyyaml", "openapi-spec-validator"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
