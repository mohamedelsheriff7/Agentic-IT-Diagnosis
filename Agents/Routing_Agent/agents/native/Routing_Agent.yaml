kind: native
name: Routing_Agent
display_name: Routing Agent
description: Routes investigated IT tickets using the recorded diagnosis, supporting evidence, resolver boundaries,
  and evidence-based confidence. Returns the recommended and actually assigned groups, three alternative candidates
  where available, and an auditable reason. Preserves mandatory human-review requirements.
context_access_enabled: true
